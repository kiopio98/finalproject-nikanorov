[project]
name = "finalproject-nikanorov"
version = "0.1.0"
description = "ValutaTrade Hub — консольный симулятор торговли валютами"
readme = "README.md"
authors = [{name = "Никита Никаноров"}]
requires-python = ">=3.12"
dependencies = ["prettytable>=3.12,<4", "requests>=2.32,<3"]

[project.scripts]
project = "main:main"
valutatrade = "main:main"

[dependency-groups]
dev = ["ruff>=0.17,<0.18"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
DATA_DIR = "data"
LOG_DIR = "logs"
RATES_TTL_SECONDS = 300
DEFAULT_BASE_CURRENCY = "USD"
LOG_MAX_BYTES = 1048576
LOG_BACKUP_COUNT = 3
